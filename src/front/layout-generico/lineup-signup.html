<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>LineUp – Sign Up</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <style>
    :root {
      --brand: #0d6efd;
      --border: #e3e8ef;
      --text: #1a1f36;
      --muted: #6b7a99;
      --bg: #f4f6f9;
      --surface: #ffffff;
    }
    * { box-sizing: border-box; }
    body { background: var(--surface); font-family: 'Segoe UI', system-ui, sans-serif; margin: 0; color: var(--text); }

    /* TOP NAV */
    .topnav {
      background: var(--surface); border-bottom: 1px solid var(--border);
      display: flex; align-items: center; justify-content: space-between;
      padding: 0 1.5rem; height: 58px; position: sticky; top: 0; z-index: 100;
    }
    .topnav-brand {
      display: flex; align-items: center; gap: .6rem;
      font-weight: 700; font-size: 1.1rem; color: var(--text); text-decoration: none;
    }
    .search-bar {
      background: var(--bg); border: 1px solid var(--border); border-radius: 10px;
      padding: .38rem 1rem .38rem 2.2rem; font-size: .86rem; color: var(--text);
      width: 240px; outline: none;
    }
    .search-bar:focus { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(13,110,253,.1); }
    .search-wrap { position: relative; }
    .search-wrap .bi { position: absolute; left: .7rem; top: 50%; transform: translateY(-50%); color: var(--muted); }
    .user-avatar {
      width: 36px; height: 36px; border-radius: 50%;
      background: var(--brand); color: #fff;
      display: flex; align-items: center; justify-content: center;
      font-size: .72rem; font-weight: 700; position: relative;
    }
    .user-avatar .dot {
      position: absolute; bottom: 1px; right: 1px;
      width: 9px; height: 9px; border-radius: 50%;
      background: #22c55e; border: 2px solid #fff;
    }

    /* SPLIT LAYOUT */
    .split { display: flex; min-height: calc(100vh - 58px); }
    .split-left {
      flex: 0 0 50%; max-width: 50%;
      padding: 3rem 4rem;
      display: flex; flex-direction: column; justify-content: center;
    }
    .split-right {
      flex: 0 0 50%; max-width: 50%;
      background: #111;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      padding: 3rem;
    }

    /* FORM */
    .section-title { font-size: 1.3rem; font-weight: 700; margin-bottom: 1.75rem; }
    .form-label { font-size: .84rem; color: var(--muted); margin-bottom: .35rem; font-weight: 500; }
    .form-control {
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; color: var(--text);
      padding: .5rem .85rem; font-size: .9rem;
    }
    .form-control:focus {
      border-color: var(--brand);
      box-shadow: 0 0 0 3px rgba(13,110,253,.1);
      background: var(--surface);
    }
    .form-control::placeholder { color: #c0c8d8; }
    .input-icon { position: relative; }
    .input-icon .bi { position: absolute; left: .85rem; top: 50%; transform: translateY(-50%); color: #c0c8d8; }
    .input-icon .form-control { padding-left: 2.4rem; }

    /* PRIMARY BUTTON */
    .btn-primary-solid {
      background: var(--text); color: #fff; border: none;
      border-radius: 10px; padding: .7rem 1rem;
      font-size: .92rem; font-weight: 600; width: 100%;
      cursor: pointer; transition: .15s;
    }
    .btn-primary-solid:hover { background: #2d3748; }

    /* SOCIAL BUTTONS */
    .btn-social {
      display: flex; align-items: center; justify-content: center; gap: .55rem;
      background: var(--surface); border: 1px solid var(--border);
      border-radius: 10px; padding: .55rem 1rem;
      font-size: .87rem; font-weight: 500; color: var(--text);
      cursor: pointer; transition: .15s; width: 100%;
    }
    .btn-social:hover { background: var(--bg); }

    .divider { display: flex; align-items: center; gap: .75rem; color: var(--muted); font-size: .82rem; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }

    .login-link { color: var(--text); font-weight: 600; text-decoration: none; }
    .login-link:hover { text-decoration: underline; }

    /* RIGHT PANEL LOGO */
    .big-logo-wrap { display: flex; justify-content: center; margin-bottom: 2rem; }
  </style>
</head>
<body>

<!-- TOP NAV -->
<header class="topnav">
  <div class="d-flex align-items-center gap-3">

    </a>
    <div class="search-wrap">
      <i class="bi bi-search"></i>
      <input class="search-bar" type="search" placeholder="search">
    </div>
  </div>
  <div class="d-flex align-items-center gap-3">
    <button style="background:none;border:none;cursor:pointer;position:relative;">
      <i class="bi bi-bell fs-5" style="color:#6b7a99"></i>
      <span class="position-absolute bg-danger rounded-circle" style="width:8px;height:8px;top:0;right:0;border:2px solid #fff"></span>
    </button>
    <div class="d-flex align-items-center gap-2" style="cursor:pointer">
      <div class="user-avatar">PJ<div class="dot"></div></div>
      <div>
        <div style="font-size:.83rem;font-weight:600;line-height:1.1">John Reads</div>
        <div style="font-size:.71rem;color:var(--muted)">Administrator</div>
      </div>
      <i class="bi bi-chevron-down" style="font-size:.7rem;color:#9ca3af"></i>
    </div>
  </div>
</header>

<!-- SPLIT CONTENT -->
<div class="split">

  <!-- LEFT: Form -->
  <div class="split-left">
    <div style="max-width: 480px; width: 100%;">
      <div class="section-title">Sign Up</div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label">First name</label>
          <input type="text" class="form-control" placeholder="input text">
        </div>
        <div class="col-6">
          <label class="form-label">Last name</label>
          <input type="text" class="form-control" placeholder="input text">
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-6">
          <label class="form-label">Username</label>
          <input type="text" class="form-control" placeholder="input text">
        </div>
        <div class="col-6">
          <label class="form-label">Email</label>
          <div class="input-icon">
            <i class="bi bi-envelope"></i>
            <input type="email" class="form-control" placeholder="">
          </div>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-6">
          <label class="form-label">Password</label>
          <div class="input-icon">
            <i class="bi bi-lock"></i>
            <input type="password" class="form-control" placeholder="">
          </div>
        </div>
        <div class="col-6">
          <label class="form-label">Confirm Password</label>
          <div class="input-icon">
            <i class="bi bi-lock"></i>
            <input type="password" class="form-control" placeholder="">
          </div>
        </div>
      </div>

      <div class="form-check mb-4">
        <input class="form-check-input" type="checkbox" id="terms">
        <label class="form-check-label" for="terms" style="font-size:.85rem;color:var(--muted)">
          I agree with terms and conditions
        </label>
      </div>

      <button class="btn-primary-solid mb-3">Save an continue</button>

      <div class="divider mb-3">or</div>

      <div class="row g-2 mb-3">
        <div class="col-6">
          <button class="btn-social">
            <img src="https://www.svgrepo.com/show/475656/google-color.svg" width="18" alt="G">
            Continue with Google
          </button>
        </div>
        <div class="col-6">
          <button class="btn-social">
            <i class="bi bi-apple fs-5"></i>
            Login with AppleID
          </button>
        </div>
      </div>

      <p class="text-center mb-0" style="font-size:.85rem;color:var(--muted)">
        Already have an account? <a href="#" class="login-link">Log In</a>
      </p>
    </div>
  </div>

  <!-- RIGHT: Branding -->
  <div class="split-right">
    <!-- Big logo on dark background -->
    <div class="big-logo-wrap">
